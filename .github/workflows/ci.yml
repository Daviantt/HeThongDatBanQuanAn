name: PostgreSQL, Java and JavaScript
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: giavien
          POSTGRES_PASSWORD: ci-disposable-database-only
          POSTGRES_DB: postgres
          TZ: Asia/Ho_Chi_Minh
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U giavien -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_POSTGRES_PASSWORD: ci-disposable-database-only
      SPRING_CONFIG_IMPORT: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Maven 3.9.14 with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.14
          curl -fsSLO "$base/apache-maven-3.9.14-bin.tar.gz"
          curl -fsSLO "$base/apache-maven-3.9.14-bin.tar.gz.sha512"
          printf '%s  %s\n' "$(cat apache-maven-3.9.14-bin.tar.gz.sha512)" apache-maven-3.9.14-bin.tar.gz | sha512sum -c -
          tar -xzf apache-maven-3.9.14-bin.tar.gz
          echo "$RUNNER_TEMP/apache-maven-3.9.14/bin" >> "$GITHUB_PATH"
      - name: Create isolated test database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          db="giavien_test_$(openssl rand -hex 16)"
          docker exec "$PG_CONTAINER" createdb -U giavien "$db"
          echo "PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
          echo "TEST_DATABASE=$db" >> "$GITHUB_ENV"
          echo "TEST_POSTGRES_URL=jdbc:postgresql://127.0.0.1:15432/$db" >> "$GITHUB_ENV"
      - name: Java package and PostgreSQL regression tests
        run: mvn -B --no-transfer-progress clean verify
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: JavaScript tests
        run: npm test
      - name: JAR startup, production bootstrap and restart
        run: node scripts/smoke-postgres.cjs
      - name: Remove test database
        if: always() && env.TEST_DATABASE != ''
        run: docker exec "$PG_CONTAINER" dropdb -U giavien "$TEST_DATABASE"
      - name: Test reports and executable JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            target/surefire-reports/*.xml
            target/surefire-reports/*.txt
            target/giavien-restaurant-0.1.0.jar
          if-no-files-found: warn
          retention-days: 7
