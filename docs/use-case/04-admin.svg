<ellipse cx="600" cy="275" rx="225" ry="58" fill="#f5effa" stroke="#21323a" stroke-width="1.6"/>
<text x="600" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#52646c">QL01</text>
<text x="600" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Xem món, bàn, tổ hợp</text>
<text x="600" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">và tài khoản hệ thống</text>
<ellipse cx="600" cy="455" rx="225" ry="49" fill="#f5effa" stroke="#21323a" stroke-width="1.6"/>
<text x="600" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#52646c">QL02</text>
<text x="600" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Lưu món ăn</text>
<ellipse cx="1180" cy="365" rx="225" ry="49" fill="#f5effa" stroke="#21323a" stroke-width="1.6"/>
<text x="1180" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#52646c">QL03</text>
<text x="1180" y="376" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Thêm món mới</text>
<ellipse cx="1180" cy="555" rx="225" ry="49" fill="#f5effa" stroke="#21323a" stroke-width="1.6"/>
<text x="1180" y="538" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#52646c">QL04</text>
<text x="1180" y="566" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Sửa món / trạng thái bán</text>
<ellipse cx="600" cy="665" rx="225" ry="49" fill="#f5effa" stroke="#21323a" stroke-width="1.6"/>
<text x="600" y="648" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#52646c">QL05</text>
<text x="600" y="676" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Bật / tạm ngừng bàn</text>
<ellipse cx="600" cy="815" rx="225" ry="49" fill="#f5effa" stroke="#21323a" stroke-width="1.6"/>
<text x="600" y="798" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#52646c">QL06</text>
<text x="600" y="826" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Thêm tổ hợp ghép bàn</text>
<ellipse cx="600" cy="965" rx="225" ry="49" fill="#f5effa" stroke="#21323a" stroke-width="1.6"/>
<text x="600" y="948" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#52646c">QL07</text>
<text x="600" y="976" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Xóa tổ hợp ghép bàn</text>
<ellipse cx="600" cy="1115" rx="225" ry="58" fill="#f5effa" stroke="#21323a" stroke-width="1.6"/>
<text x="600" y="1085" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#52646c">QL08</text>
<text x="600" y="1113" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Cấu hình cọc / giữ bàn</text>
<text x="600" y="1140" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Dọn bàn / chờ khách muộn</text>
<ellipse cx="600" cy="1265" rx="225" ry="49" fill="#f5effa" stroke="#21323a" stroke-width="1.6"/>
<text x="600" y="1248" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#52646c">QL09</text>
<text x="600" y="1276" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Tạo tài khoản nhân viên</text>
