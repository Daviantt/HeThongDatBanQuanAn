<text x="65" y="109" text-anchor="start" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#21323a">Chi tiết quản trị của quản lý</text>
<text x="65" y="143" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#52646c">Chỉ ADMIN có quyền cấu hình • Kế thừa quyền nhân viên ở trang 3</text>
