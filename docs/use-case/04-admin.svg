<text x="130" y="645" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21323a">Quản lý</text>
<text x="130" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#21323a">ADMIN</text>
<rect x="950" y="675" width="455" height="200" fill="#fffdf6" stroke="#c7bfa1" stroke-width="1.2"/>
<text x="970" y="706" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21323a">Bàn và tổ hợp</text>
<text x="970" y="740" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Tạm ngừng bàn cần xử lý lượt hiệu lực.</text>
<text x="970" y="769" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Tổ hợp gồm 2-3 bàn có thật.</text>
<text x="970" y="798" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Khi thêm: liền nhau cùng tầng,</text>
<text x="970" y="827" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">  không ghép qua vườn / thông tầng.</text>
<text x="970" y="856" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Không thêm / xóa bàn hoặc kéo thả.</text>
<rect x="950" y="950" width="455" height="200" fill="#fffdf6" stroke="#c7bfa1" stroke-width="1.2"/>
<text x="970" y="981" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21323a">Phạm vi cấu hình</text>
<text x="970" y="1015" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Chỉ 4 thông số cọc và thời gian trên.</text>
<text x="970" y="1044" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Cọc của lượt đặt cũ được giữ nguyên.</text>
<text x="970" y="1073" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Danh mục món cố định; không xóa món.</text>
<text x="970" y="1102" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Tạo tài khoản STAFF mới; email duy nhất.</text>
<text x="970" y="1131" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Chưa sửa / khóa / xóa tài khoản.</text>
</svg>