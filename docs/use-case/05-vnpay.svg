<rect x="950" y="395" width="455" height="200" fill="#fffdf6" stroke="#c7bfa1" stroke-width="1.2"/>
<text x="970" y="426" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21323a">Khởi tạo / thử lại</text>
<text x="970" y="460" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Chủ lượt; PENDING / UNPAID; còn hạn.</text>
<text x="970" y="489" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• VNPAY được cấu hình hợp lệ.</text>
<text x="970" y="518" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Dùng lại giao dịch đang chờ.</text>
<text x="970" y="547" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Thất bại: tạo lần mới trong hạn.</text>
<text x="970" y="576" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Callback lặp không ghi nhận hai lần.</text>
<rect x="360" y="640" width="470" height="113" fill="#fffdf6" stroke="#c7bfa1" stroke-width="1.2"/>
<text x="380" y="671" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21323a">Quyền xem kết quả</text>
<text x="380" y="705" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">Return công khai với tham số hợp lệ.</text>
<text x="380" y="734" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">API: chủ lượt hoặc STAFF / ADMIN.</text>
<rect x="360" y="960" width="470" height="229" fill="#fffdf6" stroke="#c7bfa1" stroke-width="1.2"/>
<text x="380" y="991" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21323a">Kết quả nhận cọc</text>
<text x="380" y="1025" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Thành công trong hạn: CONFIRMED / PAID.</text>
<text x="380" y="1054" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Tiền đến khi lượt đã hủy / hết hạn:</text>
<text x="380" y="1083" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">  REFUND_PENDING; không lấy lại bàn.</text>
<text x="380" y="1112" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Thất bại: chưa xác nhận cọc.</text>
<text x="380" y="1141" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Hoàn tiền do nhân viên làm ngoài hệ thống.</text>
<text x="380" y="1170" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Chưa xác minh giao dịch Sandbox thực tế.</text>
