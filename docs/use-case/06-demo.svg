<text x="600" y="808" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Tự bấm mô phỏng</text>
<text x="600" y="835" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">thanh toán thành công</text>
<ellipse cx="1180" cy="745" rx="225" ry="58" fill="#f7f9fa" stroke="#21323a" stroke-width="1.6"/>
<text x="1180" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#52646c">DM04</text>
<text x="1180" y="743" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">Kiểm tra token, 60 giây</text>
<text x="1180" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">và hiệu lực lượt đặt</text>
