<text x="600" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#21323a">phiên demo</text>
<ellipse cx="600" cy="810" rx="225" ry="58" fill="#fff4e8" stroke="#21323a" stroke-width="1.6"/>
