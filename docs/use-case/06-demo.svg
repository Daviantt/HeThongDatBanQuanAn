<text x="130" y="780" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#21323a">QR demo</text>
<rect x="950" y="280" width="455" height="287" fill="#fffdf6" stroke="#c7bfa1" stroke-width="1.2"/>
<text x="970" y="311" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21323a">Phạm vi mô phỏng</text>
<text x="970" y="345" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Chủ lượt tạo phiên khi còn giữ bàn.</text>
<text x="970" y="374" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Quét QR mở URL có token ngẫu nhiên.</text>
<text x="970" y="403" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Người giữ token không cần đăng nhập.</text>
<text x="970" y="432" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Sau 60 giây từ lúc tạo phiên mới bấm.</text>
<text x="970" y="461" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Chờ / quét mã không tự xác nhận cọc.</text>
<text x="970" y="490" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Tải lại không khởi động lại đếm giờ.</text>
<text x="970" y="519" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Chỉ công khai mã đặt, số tiền, trạng thái.</text>
<text x="970" y="548" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Bật VNPAY thì luồng QR demo tắt.</text>
<rect x="360" y="1030" width="1045" height="113" fill="#fffdf6" stroke="#c7bfa1" stroke-width="1.2"/>
<text x="380" y="1061" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21323a">Hiệu lực và đồng bộ</text>
<text x="380" y="1095" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">Lượt đã hủy / hết hạn không được xác nhận lại; thao tác lặp không tạo thêm khoản cọc demo.</text>
<text x="380" y="1124" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">Các thiết bị đang mở phiên tự cập nhật kết quả. Dữ liệu ghi nhà cung cấp DEMO, không có tiền thật.</text>
</svg>