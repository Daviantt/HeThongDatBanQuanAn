<text x="970" y="850" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• 1-12 khách; 4 chỗ / bàn; tối đa 3 bàn.</text>
<text x="970" y="879" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Ghép bàn liền nhau, cùng tầng.</text>
<text x="970" y="908" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Sửa món: trước ít nhất 2 giờ.</text>
<text x="970" y="937" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Yêu cầu đổi: đã xác nhận, chưa đến giờ.</text>
<text x="970" y="966" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Tự hủy: PENDING / CONFIRMED,</text>
<text x="970" y="995" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">  trước giờ đến; hoàn nếu còn ≥ 3 giờ.</text>
<text x="970" y="1024" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Món đặt trước là tùy chọn.</text>
<text x="970" y="1053" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Hết hạn giữ bàn: tự giải phóng nội bộ.</text>
