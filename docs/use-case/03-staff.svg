<rect x="950" y="245" width="455" height="171" fill="#fffdf6" stroke="#c7bfa1" stroke-width="1.2"/>
<text x="970" y="276" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21323a">Điều kiện vận hành</text>
<text x="970" y="310" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Nhận khách: đã xác nhận; từ 15 phút</text>
<text x="970" y="339" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">  trước giờ hẹn đến trước giờ kết thúc.</text>
<text x="970" y="368" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Hoàn tất: khách đã nhận bàn.</text>
<text x="970" y="397" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Không đến: hết thời gian chờ cấu hình.</text>
<rect x="950" y="615" width="455" height="171" fill="#fffdf6" stroke="#c7bfa1" stroke-width="1.2"/>
<text x="970" y="646" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21323a">Đổi bàn / giờ</text>
<text x="970" y="680" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Đã xác nhận và chưa đến giờ cũ.</text>
<text x="970" y="709" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Giữ nguyên số bàn của lượt đặt.</text>
<text x="970" y="738" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Đổi lịch không bắt buộc có yêu cầu chờ.</text>
<text x="970" y="767" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Từ chối cần một yêu cầu PENDING.</text>
<rect x="950" y="1235" width="455" height="142" fill="#fffdf6" stroke="#c7bfa1" stroke-width="1.2"/>
<text x="970" y="1266" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#21323a">Hoàn tiền</text>
<text x="970" y="1300" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Chuyển tiền bên ngoài hệ thống.</text>
<text x="970" y="1329" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Nhập mã hoàn để ghi nhận kết quả.</text>
<text x="970" y="1358" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#21323a">• Cọc chính và khoản thu thêm tách riêng.</text>
