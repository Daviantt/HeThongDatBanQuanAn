spring.application.name=giavien-restaurant
spring.config.import=optional:file:./config/payment.properties,optional:file:./config/database.properties
spring.profiles.default=demo
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:15432/giavien}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER:giavien}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.thymeleaf.cache=false
server.error.include-message=never
app.demo=false
app.payment.demo-enabled=${DEMO_PAYMENT_ENABLED:false}
app.payment.demo-base-url=${DEMO_PAYMENT_BASE_URL:}
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay/return}
