<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Chuyển khoản demo')}"></head><body><header th:replace="~{fragments :: header}"></header>
<main class="shell page"><section class="panel demo-checkout" id="takeaway-demo-payment" th:attr="data-status-url=@{/takeaway/payment/{token}/status(token=${token})},data-state=${payment.status}"><p class="eyebrow">GIA VIÊN · CHUYỂN KHOẢN MÔ PHỎNG</p><h1>Quét QR thanh toán</h1><p class="notice warning">Đây là QR demo phục vụ đồ án, không liên kết ngân hàng và không chuyển tiền thật.</p><p th:text="|Đơn ${payment.code}|"></p><strong class="payment-amount" th:text="${@fmt.money(payment.amount)}"></strong><div id="takeaway-demo-qr" th:hidden="${payment.status == 'PAID'}"><img class="demo-qr-image" th:src="@{/takeaway/payment/{token}/qr.png(token=${token})}" width="320" height="320" alt="QR chuyển khoản demo"/><p>Quét QR trên điện thoại hoặc xác nhận ngay trên trang này.</p><a class="demo-qr-link" th:href="${qrUrl}" th:text="${qrUrl}"></a></div><p id="takeaway-demo-message" role="status" aria-live="polite" th:text="${payment.message}"></p><p th:if="${error}" class="notice error" th:text="${error}"></p><form id="takeaway-demo-confirm" th:action="@{/takeaway/payment/{token}/confirm(token=${token})}" method="post" th:hidden="${payment.status == 'PAID'}"><button id="takeaway-demo-button" class="button full" type="submit" th:disabled="${payment.status != 'READY'}">Mô phỏng chuyển khoản thành công</button></form><a th:if="${payment.status == 'PAID'}" th:href="@{/takeaway/orders/{id}(id=${payment.orderId})}" class="button full">Xem đơn hàng →</a></section></main><footer th:replace="~{fragments :: footer}"></footer><script src="/js/takeaway-payment.js" defer></script></body></html>
