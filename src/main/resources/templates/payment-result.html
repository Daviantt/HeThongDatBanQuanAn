<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Kết quả thanh toán')}"></head>
  <body>
    <header th:replace="~{fragments :: header}"></header>
    <main class="shell page">
      <section class="panel empty-state" id="payment-result"
          th:attr="data-status-url=${result.waiting ? '/api/bookings/' + result.bookingId + '/payment-status' : ''}">
        <p class="eyebrow">VNPAY SANDBOX</p>
        <h1 id="payment-title" th:text="${result.title}"></h1>
        <p id="payment-message" role="status" aria-live="polite" th:text="${result.message}"></p>
        <a th:if="${result.valid}" th:href="@{/bookings/{id}(id=${result.bookingId})}" class="button">Xem lượt đặt →</a>
        <a th:unless="${result.valid}" href="/bookings" class="button">Xem lịch hẹn →</a>
        <p class="helper">Môi trường thử nghiệm của VNPAY, không thu tiền thật.</p>
      </section>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
    <script src="/js/payment.js" defer></script>
  </body>
</html>
